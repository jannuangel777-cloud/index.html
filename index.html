<!DOCTYPE html>
<html>

<head>
<title>Fake News Detection</title>

<style>

body{
    font-family: Arial;
    background: linear-gradient(to right,#4facfe,#00f2fe);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    padding:40px;
    border-radius:10px;
    width:500px;
    text-align:center;
}

textarea{
    width:100%;
    padding:10px;
}

button{
    margin-top:15px;
    padding:10px 20px;
    background:#4facfe;
    border:none;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.result{
    margin-top:20px;
    padding:15px;
    background:#f5f5f5;
    border-radius:6px;
}

</style>

</head>

<body>

<div class="container">

<h1>📰 Fake News Detector</h1>

<form method="POST">

<textarea name="news" rows="8" placeholder="Paste the news here...">{{news}}</textarea>

<br>

<button type="submit">Check News</button>

</form>

{% if prediction %}

<div class="result">

<h2>Prediction: {{prediction}}</h2>

<h3>Confidence: {{confidence}}%</h3>

</div>

{% endif %}

</div>

</body>

</html>
